buildscript {
    repositories {
        mavenLocal()
        mavenCentral().content {
            excludeModule("javax.media", "jai_core")
        }
        gradlePluginPortal()
        maven {
            url = uri("https://central.sonatype.com/repository/maven-snapshots")
        }
        maven {
            url = uri("https://mifos.jfrog.io/artifactory/mifosx-gradle-local")
        }
    }

    dependencies {
        classpath "org.mifos.conventions.gradle:mifos-conventions-gradle-base-java:0.1.0-SNAPSHOT"
    }
}

apply plugin: "org.mifos.conventions.gradle.base.layout"

rootProject.name = "mifos-commons-boot"


mifos {
    project {
        groupId = "org.mifos.commons"
        description = "Mifos Commons Library"
        basePackage = "org.mifos.commons"
        inceptionYear = "2026"
    }
    developers {
        "vidakovic" {
            firstname = "Aleksandar"
            lastname = "Vidakovic"
            email = "aleks@mifos.org"
            timezone = "UTC+2"
            roles = ["developer", "architect"]
        }
    }
}

include(":mifos-commons-boot-core")
project(":mifos-commons-boot-core").projectDir = file("${rootDir}/modules/boot/core")
include(":mifos-commons-boot-persistence-relational-core")
